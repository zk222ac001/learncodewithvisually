name: Lab reading and discovery checks
on:
  pull_request:
    paths:
      - '*.html'
      - '*labs.css'
      - 'pointers-3d.css'
      - 'sitemap.xml'
      - 'tests/browser/lab-reading.spec.cjs'
      - '.github/workflows/lab-reading.yml'
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/seo.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/lab-reading.spec.cjs tests/browser/course-labs.spec.cjs tests/browser/pointers-3d.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-previews
          path: |
            reading-previews/
            test-results/
