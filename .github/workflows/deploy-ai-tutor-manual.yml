name: Deploy AI Tutor Worker (manual, private)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PRIVATE_AI_TUTOR to deploy with public AI disabled"
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_PRIVATE_AI_TUTOR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-tutor-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm public AI switches are disabled
        run: |
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('workers/ai-tutor/wrangler.jsonc','utf8')); if(cfg.vars.AI_ENABLED!=='false'||cfg.vars.DAILY_AI_REQUEST_LIMIT!=='25')process.exit(1); if(!fs.readFileSync('ai-tutor-config.js','utf8').includes('enabled: false'))process.exit(1)"
      - run: npm ci
      - name: Validate Node and Worker tests
        run: |
          npm test
          node --test workers/ai-tutor/test/*.test.mjs
      - name: Deploy only after explicit confirmation
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai-tutor
          wranglerVersion: '4.149.0'
          command: deploy --config wrangler.jsonc
      - name: Check deployed backend release marker
        run: |
          node -e "const url='https://learncodevisually-ai-tutor.learncodevisually-zk222ac-2026.workers.dev/health'; const sleep=ms=>new Promise(r=>setTimeout(r,ms)); (async()=>{for(let i=0;i<12;i++){try{const response=await fetch(url,{headers:{'Cache-Control':'no-cache'}});const h=await response.json();if(response.ok&&h.status==='ok'&&h.enabled===false&&h.release==='general-programming-v1'&&h.capabilities?.includes('general-programming')&&h.ready===true){console.log('Private release verified; required bindings present; public AI is disabled');return;}}catch(e){}await sleep(5000);}throw new Error('Deployment verification failed; inspect Workers deployment and keep public AI disabled.');})().catch(e=>{console.error(e);process.exitCode=1})"
