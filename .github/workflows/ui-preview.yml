name: UI preview checks
on:
  pull_request:
    paths:
      - 'ux-refresh.*'
      - 'scripts/build-ui-preview.py'
      - 'course.js'
      - 'index.html'
      - 'c-for-loop-visualization.html'
      - 'tests/browser/ux-refresh.spec.cjs'
      - '.github/workflows/ui-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build-ui-preview.py
      - run: npx playwright test tests/browser/ux-refresh.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview-screenshots
          path: ui-previews/
          if-no-files-found: ignore
